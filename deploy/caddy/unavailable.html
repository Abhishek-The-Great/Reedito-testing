<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Reedito is temporarily unavailable</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f6f8fc; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 520px); padding: 40px; border: 1px solid #e3e8f0; border-radius: 20px; background: #fff; box-shadow: 0 16px 48px rgb(24 39 75 / 8%); }
      .mark { width: 48px; height: 48px; margin-bottom: 26px; display: grid; place-items: center; border-radius: 14px; color: white; background: #3157d5; font-weight: 800; font-size: 27px; }
      h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 5vw, 2.15rem); line-height: 1.15; letter-spacing: -.035em; }
      p { margin: 0; color: #586174; line-height: 1.65; }
      .retry { margin-top: 24px; }
      a { color: #2447bd; font-weight: 650; text-underline-offset: 3px; }
      @media (max-width: 520px) { main { padding: 28px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">R</div>
      <h1>Reedito is temporarily unavailable</h1>
      <p>We couldn’t load the site right now. Your account and articles are safe. Please try again in a little while.</p>
      <p class="retry"><a href="/">Try again</a></p>
    </main>
  </body>
</html>
