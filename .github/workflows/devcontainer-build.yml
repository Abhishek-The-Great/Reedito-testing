name: Devcontainer image

# Builds the dev container base image used by .devcontainer/devcontainer.json
# (VS Code Dev Containers + GitHub Codespaces) and publishes it to GHCR.
#
# Triggers only on push to main (path-filtered) and manual dispatch. PRs
# don't trigger this workflow — devcontainer.json references the :latest
# tag, so pre-publishing per-PR images would just produce unused tags.
# A broken Dockerfile change in a PR will surface when the merge to main
# fires this workflow; the previously-good :latest stays in place until
# the next successful run.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docker/reedito-dev/**'
      - '.github/workflows/devcontainer-build.yml'
      - 'scripts/**'
      - '.github/hooks/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      # Individual workspace manifests aren't listed: the image installs via
      # `pnpm install --filter "reedito..." --frozen-lockfile`, so any dependency
      # change that affects the image necessarily updates pnpm-lock.yaml above.

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: devcontainer-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: |
          IMAGE_OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "repository=ghcr.io/${IMAGE_OWNER}/reedito-devcontainer" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/reedito-dev/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:latest
            ${{ steps.image.outputs.repository }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.repository }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.repository }}:buildcache,mode=max
