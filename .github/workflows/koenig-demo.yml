name: Koenig Demo

# Optional koenig-lexical demo deployment to GitHub Pages. Requires Pages,
# REEDITO_ENABLE_KOENIG_DEMO_DEPLOY, a configured demo domain, and KLIPY_API_KEY.

on:
  push:
    branches: [main]
    paths:
      - 'koenig/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/koenig-demo.yml'
  workflow_dispatch:

concurrency:
  group: koenig-demo
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.1

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: vars.REEDITO_ENABLE_KOENIG_DEMO_DEPLOY == 'true' && vars.REEDITO_KOENIG_DEMO_DOMAIN != ''
    permissions:
      contents: write
    env:
      VITE_KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-args: --filter @reedito/koenig-lexical...

      - name: Build demo
        run: pnpm nx run @reedito/koenig-lexical:build:demo

      - name: Add CNAME
        env:
          DEMO_DOMAIN: ${{ vars.REEDITO_KOENIG_DEMO_DOMAIN }}
        run: echo "$DEMO_DOMAIN" > koenig/koenig-lexical/dist/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./koenig/koenig-lexical/dist
